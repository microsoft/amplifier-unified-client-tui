[project]
name = "amplifier-unified-client-tui"
version = "0.5.0rc1"
description = "An optional terminal client for Amplifier Unified"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
amplifier-unified-client-tui = "amplifier_tui.launcher:main"
amplifier-tui = "amplifier_tui.launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
exclude = ["**/*.zip", "**/node_modules/**", "**/target/**", ".state/**", ".evidence/**", ".venv/**", "historical/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/amplifier_tui"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src", "frontends/ratatui/src", "frontends/ratatui/Cargo.toml", "frontends/ratatui/Cargo.lock", "hatch_build.py", "pyproject.toml", "README.md", "ahp"]

[dependency-groups]
dev = [
    "pillow==12.1.1",
    "pyte==0.8.2",
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/test_documents.py", "tests/test_benchmark_observer.py", "tests/test_terminal_raster.py", "tests/test_terminal_guard.py", "tests/test_frontend_bridge.py", "tests/test_unified_projection.py", "tests/test_client_renderer.py", "tests/test_ahp_client.py", "tests/test_ahp_terminal.py", "tests/test_current_package.py"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
