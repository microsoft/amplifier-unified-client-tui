name: Qualify current AHP terminal client
on:
  workflow_dispatch:
    inputs:
      managed_runtime_only:
        description: Supplement an existing sealed platform wheel without rebuilding or publishing
        type: boolean
        default: false
      target:
        description: Managed-runtime supplement platform (used only when managed_runtime_only is true)
        type: choice
        options: [linux-x86_64, linux-arm64, macos-x86_64, macos-arm64]
        default: linux-x86_64
      host_tarball_url:
        description: HTTPS URL for independently built @amplifier/unified-host npm tarball
        required: false
      host_tarball_sha256:
        description: Reviewed SHA256 of that host artifact
        required: false
permissions:
  contents: read
jobs:
  wheel:
    if: ${{ !inputs.managed_runtime_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-14
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      HOST_TARBALL_URL: ${{ inputs.host_tarball_url }}
      HOST_TARBALL_SHA256: ${{ inputs.host_tarball_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Select tested runtimes
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup default 1.93.0
          node -e "if(Number(process.versions.node.split('.')[0])<22)process.exit(1)"
          uv sync --no-sources
      - name: Install exact reviewed independent host artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state = Path.cwd().resolve() / ".state"
          if state.resolve() != state:
              raise SystemExit("Host consumer state must stay inside this checkout")
          state.mkdir(exist_ok=True)
          consumer = state / "host"
          consumer.mkdir()  # A reused or linked consumer must fail before installing.
          (consumer / "package.json").write_text(json.dumps({
              "name": "tui-host-qualification-consumer", "version": "0.0.0", "private": True
          }) + "\n")
          PY
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          p=json.loads(Path('.qualification-inputs/provenance.json').read_text())
          source=Path('.qualification-inputs/host-796a15.tgz')
          assert source.stat().st_size==p['bytes']
          assert hashlib.sha256(source.read_bytes()).hexdigest()==p['sha256']=='796a15f3c97731b8aa8d12c991df66af6f5d01f74db9d000bab9558ff9d4e6a8'
          shutil.copyfile(source,'.state/host.tgz')
          PY
          TUI_HOST_ROOT="$(pwd -P)/.state/host"
          test "$(npm --prefix "$TUI_HOST_ROOT" --global=false --workspaces=false prefix)" = "$TUI_HOST_ROOT"
          test "$(npm --prefix "$TUI_HOST_ROOT" --global=false --workspaces=false root)" = "$TUI_HOST_ROOT/node_modules"
          npm install --prefix "$TUI_HOST_ROOT" --global=false --workspaces=false --ignore-scripts "$PWD/.state/host.tgz"
      - name: Source, package, independent install and actual terminal gate
        run: |
          export AHP_HOST_ENTRY="$PWD/.state/host/node_modules/@amplifier/unified-host/dist/cli.js"
          export AHP_HOST_MODULE="file://$PWD/.state/host/node_modules/@amplifier/unified-host/dist/index.js"
          uv run --no-sync python scripts/qualify_current.py
      - name: Export exact qualified manifest and safe evidence
        run: |
          uv run --no-sync python scripts/release_manifest.py export --output .release-assets --expected-target "${{ matrix.target }}"
          uv run --no-sync python scripts/release_manifest.py validate .release-assets/manifest.json --verify-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: amplifier-unified-client-tui-${{ matrix.target }}
          path: |
            .release-assets/*
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
      - name: Retain private qualification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-diagnostics-${{ matrix.target }}
          path: .evidence/current
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
# No automatic tag, publication, deployment or credentialed provider call.

  managed-runtime:
    if: ${{ inputs.managed_runtime_only }}
    permissions:
      contents: read
      actions: read
    runs-on: ${{ inputs.target == 'linux-x86_64' && 'ubuntu-22.04' || inputs.target == 'linux-arm64' && 'ubuntu-24.04-arm' || inputs.target == 'macos-arm64' && 'macos-14' || 'macos-15-intel' }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out qualification workflow
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.23"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Select reviewed immutable inputs
        id: inputs
        env:
          TARGET: ${{ inputs.target }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          target=os.environ['TARGET']
          value=json.loads(Path('.github/qualification-runtimes.json').read_text())[target]
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('source='+value['sourceCommit']+'\n')
              output.write('wheel-run='+str(value['wheelRun'])+'\n')
          PY
      - name: Check out exact qualified source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.inputs.outputs.source }}
          path: .state/tui-source
          persist-credentials: false
      - name: Download previously sealed exact wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: amplifier-unified-client-tui-${{ inputs.target }}
          path: .state/sealed-wheel
          run-id: ${{ steps.inputs.outputs.wheel-run }}
          github-token: ${{ github.token }}
      - name: Verify managed archives and run installed PTYs
        env:
          TARGET: ${{ inputs.target }}
        run: python .github/scripts/qualify_managed_runtime.py --target "$TARGET"
      - name: Upload portable runtime qualification only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: managed-runtime-qualified-${{ inputs.target }}
          path: .state/managed-runtime-export/*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Retain private owned fixture and command logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: managed-runtime-private-${{ inputs.target }}
          path: |
            .state/managed-runtime/private-logs
            .state/managed-runtime/installed-terminal.xml
            .state/managed-runtime/profiles
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
